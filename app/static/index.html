<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Lincoln Gaming | Contact Center</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e14;
      --panel: #121722;
      --panel2: #171d29;
      --border: #252d3a;
      --text: #f3f5f7;
      --muted: #98a2b3;
      --green: #49d17d;
      --amber: #ffbe55;
      --red: #ff6b6b;
      --blue: #6ca8ff;
      --purple: #a985ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .shell { max-width: 1500px; margin: 0 auto; padding: 28px; }
    .topbar { display:flex; justify-content:space-between; gap:20px; align-items:center; margin-bottom:24px; }
    .brand h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
    .brand p { margin:6px 0 0; color:var(--muted); }
    .actions { display:flex; gap:10px; align-items:center; }
    button { border:1px solid var(--border); background:var(--panel2); color:var(--text); padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:650; }
    button.primary { background:#f5c84b; color:#17140a; border-color:#f5c84b; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .status { font-size:13px; color:var(--muted); }
    .filters { display:grid; grid-template-columns:repeat(5,minmax(150px,1fr)) auto; gap:12px; background:var(--panel); border:1px solid var(--border); padding:16px; border-radius:14px; margin-bottom:18px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    select,input { width:100%; background:#0e131d; color:var(--text); border:1px solid var(--border); border-radius:9px; padding:10px; min-height:40px; }
    .filter-action { display:flex; align-items:end; }
    .cards { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:18px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:17px; min-height:112px; }
    .card .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .card .value { font-size:30px; font-weight:750; margin-top:12px; }
    .green .value { color:var(--green); } .red .value { color:var(--red); } .amber .value { color:var(--amber); } .blue .value { color:var(--blue); } .purple .value { color:var(--purple); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .panel-head { padding:18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
    .panel-head h2 { margin:0; font-size:17px; }
    .panel-head span { color:var(--muted); font-size:13px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:1100px; }
    th,td { text-align:left; padding:13px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; background:#10151f; position:sticky; top:0; }
    tbody tr:hover { background:#151b26; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border-radius:999px; font-size:11px; font-weight:750; white-space:nowrap; }
    .ANSWERED { background:rgba(73,209,125,.12); color:var(--green); }
    .UNSERVED_AGENTS_AVAILABLE { background:rgba(255,107,107,.12); color:var(--red); }
    .UNSERVED_NO_AGENTS_AVAILABLE { background:rgba(255,190,85,.12); color:var(--amber); }
    .IN_PROGRESS { background:rgba(108,168,255,.12); color:var(--blue); }
    .REVIEW { background:rgba(169,133,255,.12); color:var(--purple); }
    .muted { color:var(--muted); }
    .empty { padding:34px; color:var(--muted); text-align:center; }
    .error { background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.3); color:#ffc1c1; padding:12px 14px; border-radius:10px; margin-bottom:16px; display:none; }
    @media (max-width: 1100px) { .cards { grid-template-columns:repeat(3,1fr); } .filters { grid-template-columns:repeat(3,1fr); } }
    @media (max-width: 700px) { .shell { padding:16px; } .topbar { align-items:flex-start; flex-direction:column; } .cards { grid-template-columns:repeat(2,1fr); } .filters { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <h1>Lucky Lincoln Gaming</h1>
        <p>Webex Contact Center Analytics</p>
      </div>
      <div class="actions">
        <span id="status" class="status">Loading…</span>
        <button id="refreshBtn">Refresh</button>
        <button id="syncBtn" class="primary">Sync Webex</button>
      </div>
    </div>

    <div id="error" class="error"></div>

    <section class="filters">
      <div><label>From</label><input id="fromDate" type="date" /></div>
      <div><label>To</label><input id="toDate" type="date" /></div>
      <div><label>Queue</label><select id="queue"><option value="">All queues</option></select></div>
      <div><label>Agent</label><select id="agent"><option value="">All agents</option></select></div>
      <div><label>Outcome</label><select id="outcome"><option value="">All outcomes</option></select></div>
      <div class="filter-action"><button id="applyBtn">Apply</button></div>
    </section>

    <section class="cards">
      <div class="card blue"><div class="label">Total Calls</div><div class="value" id="totalCalls">—</div></div>
      <div class="card green"><div class="label">Answered</div><div class="value" id="answered">—</div></div>
      <div class="card red"><div class="label">Unserved</div><div class="value" id="unserved">—</div></div>
      <div class="card amber"><div class="label">No Agents Available</div><div class="value" id="noAgents">—</div></div>
      <div class="card red"><div class="label">Agents Available, Unserved</div><div class="value" id="agentsAvailable">—</div></div>
      <div class="card purple"><div class="label">Avg / Longest Wait</div><div class="value" id="waits" style="font-size:22px">—</div></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Call History</h2>
        <span id="rowCount">0 calls</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th><th>Caller</th><th>Queue</th><th>Wait</th><th>Result</th><th>Answered By</th><th>Agents Available</th><th>SMS</th>
            </tr>
          </thead>
          <tbody id="callsBody"></tbody>
        </table>
        <div id="empty" class="empty" style="display:none">No calls match these filters.</div>
      </div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
const state = { filtersLoaded:false };

function secondsLabel(v){
  const n = Number(v || 0); const m = Math.floor(n/60); const s = Math.round(n%60);
  return m ? `${m}m ${String(s).padStart(2,'0')}s` : `${s}s`;
}
function fmtTime(iso){
  if(!iso) return '—';
  return new Intl.DateTimeFormat([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date(iso));
}
function esc(v){ return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function outcomeLabel(v){ return ({ANSWERED:'Answered',UNSERVED_AGENTS_AVAILABLE:'Unserved — Agents Available',UNSERVED_NO_AGENTS_AVAILABLE:'Unserved — No Agents Available',IN_PROGRESS:'In Progress',REVIEW:'Review'})[v] || v || 'Unknown'; }
function queryString(includeOutcome=true){
  const p = new URLSearchParams();
  if($('fromDate').value) p.set('from_date',$('fromDate').value);
  if($('toDate').value) p.set('to_date',$('toDate').value);
  if($('queue').value) p.set('queue',$('queue').value);
  if($('agent').value) p.set('agent',$('agent').value);
  if(includeOutcome && $('outcome').value) p.set('outcome',$('outcome').value);
  return p.toString();
}
async function api(url, options){
  const res = await fetch(url, options); if(!res.ok){ throw new Error(`${res.status}: ${await res.text()}`); } return res.json();
}
function showError(err){ $('error').textContent = err.message || String(err); $('error').style.display='block'; }
function clearError(){ $('error').style.display='none'; }

async function loadFilters(){
  const data = await api('/api/dashboard/filters');
  const fill = (id, values, placeholder) => { const sel=$(id); const current=sel.value; sel.innerHTML=`<option value="">${placeholder}</option>` + values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''); sel.value=current; };
  fill('queue', data.queues || [], 'All queues');
  fill('agent', data.agents || [], 'All agents');
  fill('outcome', data.outcomes || [], 'All outcomes');
  state.filtersLoaded=true;
}

async function loadDashboard(){
  clearError(); $('status').textContent='Loading…';
  try{
    if(!state.filtersLoaded) await loadFilters();
    const [summary,calls] = await Promise.all([
      api('/api/dashboard/summary?' + queryString(false)),
      api('/api/dashboard/calls?limit=500&' + queryString(true))
    ]);
    $('totalCalls').textContent=summary.total_calls;
    $('answered').textContent=summary.answered;
    $('unserved').textContent=summary.unserved;
    $('noAgents').textContent=summary.unserved_no_agents_available;
    $('agentsAvailable').textContent=summary.unserved_agents_available;
    $('waits').textContent=`${secondsLabel(summary.avg_wait_seconds)} / ${secondsLabel(summary.longest_wait_seconds)}`;
    $('rowCount').textContent=`${calls.length} call${calls.length===1?'':'s'}`;
    $('empty').style.display=calls.length?'none':'block';
    $('callsBody').innerHTML=calls.map(c=>{
      let names='—'; try { const parsed=JSON.parse(c.available_agent_names || '[]'); if(parsed.length) names=parsed.join(', '); } catch(e) { if(c.available_agent_names) names=c.available_agent_names; }
      const available = c.available_agent_count ? `${c.available_agent_count}${names!=='—'?` — ${esc(names)}`:''}` : '0';
      const sms = c.sms_sent === true ? 'Sent' : c.sms_sent === false ? 'Not sent' : '—';
      return `<tr><td>${fmtTime(c.created_at)}</td><td>${esc(c.caller_number || 'Unknown')}</td><td>${esc(c.queue || '—')}</td><td>${secondsLabel(c.wait_seconds)}</td><td><span class="badge ${esc(c.outcome)}">${esc(outcomeLabel(c.outcome))}</span></td><td>${esc(c.answered_by || '—')}</td><td>${available}</td><td>${sms}</td></tr>`;
    }).join('');
    $('status').textContent=`Updated ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`;
  }catch(err){ showError(err); $('status').textContent='Load failed'; }
}

$('applyBtn').addEventListener('click', loadDashboard);
$('refreshBtn').addEventListener('click', loadDashboard);
$('syncBtn').addEventListener('click', async ()=>{
  const btn=$('syncBtn'); clearError(); btn.disabled=true; btn.textContent='Syncing…'; $('status').textContent='Syncing Webex…';
  try { await api('/api/sync', {method:'POST'}); await loadFilters(); await loadDashboard(); }
  catch(err){ showError(err); $('status').textContent='Sync failed'; }
  finally { btn.disabled=false; btn.textContent='Sync Webex'; }
});

loadDashboard();
</script>
</body>
</html>
