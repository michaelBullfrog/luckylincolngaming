services:
  - type: web
    name: lucky-lincoln-contact-center
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lucky-lincoln-contact-center-db
          property: connectionString
      - key: WEBEX_SEARCH_URL
        sync: false
      - key: WEBEX_ACCESS_TOKEN
        sync: false
      - key: SYNC_LOOKBACK_MINUTES
        value: "1440"

databases:
  - name: lucky-lincoln-contact-center-db
    databaseName: lucky_lincoln
    user: lucky_lincoln
